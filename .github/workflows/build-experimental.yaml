# See
# - https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
# - https://docs.github.com/en/actions/learn-github-actions/contexts
# - https://github.com/docker/build-push-action/blob/master/docs/advanced/multi-platform.md
name: Experimental images

on:
  # Rebuild every quarter on Sunday at 8:20 UTC
  schedule:
    - cron: 20 8 * 1/3 0

  # Build on push to master
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-experimental.yaml
      - "*.dockerfile"
      - files/**

concurrency:
  group: build-experimental-images
  cancel-in-progress: true

# Run the automated tests first, then publish the images if the tests pass
permissions:
  contents: read

jobs:
  # Bake the latest Baikal release into the experimental images
  resolve:
    name: Resolve Baikal version
    runs-on: ubuntu-latest
    outputs:
      baikal-version: ${{ steps.release.outputs.BAIKAL_VERSION }}
    steps:
      - name: Look up latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REF_NAME=$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName)
          if [ -z "$REF_NAME" ]; then
            echo "::error::Could not determine the latest release"
            exit 1
          fi
          echo BAIKAL_VERSION=${REF_NAME/+*/} >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.dockerfile }}
    uses: ./.github/workflows/test-job.yaml
    with:
      dockerfile: ${{ matrix.dockerfile }}
    strategy:
      fail-fast: true
      matrix:
        dockerfile:
          - apache
          - apache-php8.2
          - nginx
          - nginx-php8.2

  apache:
    name: Apache
    needs: [test, resolve]
    uses: ./.github/workflows/build-job.yaml
    with:
      dockerfile: apache.dockerfile
      image-version: experimental
      baikal-version: ${{ needs.resolve.outputs.baikal-version }}
      tags: |
        yedomalabs/baikal:experimental-apache
        yedomalabs/baikal:experimental
    secrets: inherit

  apache_php82:
    name: Apache (PHP 8.2)
    needs: [test, resolve]
    uses: ./.github/workflows/build-job.yaml
    with:
      dockerfile: apache-php8.2.dockerfile
      image-version: experimental
      baikal-version: ${{ needs.resolve.outputs.baikal-version }}
      tags: |
        yedomalabs/baikal:experimental-apache-php8.2
        yedomalabs/baikal:experimental-php8.2
    secrets: inherit

  nginx:
    name: Nginx
    needs: [test, resolve]
    uses: ./.github/workflows/build-job.yaml
    with:
      dockerfile: nginx.dockerfile
      platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
      image-version: experimental
      baikal-version: ${{ needs.resolve.outputs.baikal-version }}
      tags: yedomalabs/baikal:experimental-nginx
    secrets: inherit

  nginx_php82:
    name: Nginx (PHP 8.2)
    needs: [test, resolve]
    uses: ./.github/workflows/build-job.yaml
    with:
      dockerfile: nginx-php8.2.dockerfile
      platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
      image-version: experimental
      baikal-version: ${{ needs.resolve.outputs.baikal-version }}
      tags: yedomalabs/baikal:experimental-nginx-php8.2
    secrets: inherit
