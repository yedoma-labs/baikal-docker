# Based on http://sabre.io/baikal/install/

# Honor X-Forwarded-Proto from a TLS-terminating reverse proxy so generated
# redirects (CalDAV/CardDAV) and PHP's HTTPS detection use the public scheme.
# Only "http" and "https" are accepted; anything else falls back to $scheme.
map $http_x_forwarded_proto $public_scheme {
  https   https;
  http    http;
  default $scheme;
}

map $public_scheme $fastcgi_https {
  https   on;
  default "";
}

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  server_name _;

  root   /var/www/baikal/html;
  index index.php;

  rewrite ^/.well-known/caldav $public_scheme://$http_host/dav.php redirect;
  rewrite ^/.well-known/carddav $public_scheme://$http_host/dav.php redirect;

  ssl_certificate /etc/nginx/ssl/nginx.crt;
  ssl_certificate_key /etc/nginx/ssl/nginx.key;

  charset utf-8;

  # Deny access to
  # - .ht* files
  # - Baikal's "Core" folder
  # - Baikal's "Specific" folder
  location ~ /(\.ht|Core|Specific) {
    deny all;
    return 404;
  }

  # Pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
  location ~ ^(.+\.php)(.*)$ {
    # "internal" is only used when Baikal is running under a base path,
    # see 50-respect-baikal-base-uri.sh.
    # internal;
    try_files $fastcgi_script_name =404;
    include        /etc/nginx/fastcgi_params;
    fastcgi_split_path_info  ^(.+\.php)(.*)$;
    fastcgi_pass   unix:/var/run/php-fpm.sock;
    fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    fastcgi_param  PATH_INFO        $fastcgi_path_info;
    fastcgi_param  HTTPS            $fastcgi_https;
  }
}
