# InjectedServerName dav.example.com

# Hide version details and set security headers for all virtual hosts
ServerTokens Prod
ServerSignature Off
TraceEnable off
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Strict-Transport-Security "max-age=31536000"

# For more details, see http://sabre.io/baikal/install/
<VirtualHost *:80>

	# InjectedServerAlias dav.example.org dav.example.io
	DocumentRoot /var/www/baikal/html

	RewriteEngine On
	RewriteRule /.well-known/carddav /dav.php [R,L]
	RewriteRule /.well-known/caldav /dav.php [R,L]

	<Directory "/var/www/baikal/html">
		Options None
		Options +FollowSymlinks
		AllowOverride All

		# Confiugration for apache-2.2:
		Order allow,deny
		Allow from all

		# Confiugration for apache-2.4:
		Require all granted
	</Directory>

</VirtualHost>

<VirtualHost *:443>

	# InjectedServerAlias dav.example.org dav.example.io
	DocumentRoot /var/www/baikal/html

	RewriteEngine On
	RewriteRule /.well-known/carddav /dav.php [R,L]
	RewriteRule /.well-known/caldav /dav.php [R,L]

	<Directory "/var/www/baikal/html">
		Options None
		Options +FollowSymlinks
		AllowOverride All

		# Confiugration for apache-2.2:
		Order allow,deny
		Allow from all

		# Confiugration for apache-2.4:
		Require all granted
	</Directory>

	# For more details, see https://bettercrypto.org/#_apache
	SSLEngine on
	SSLCertificateFile /etc/ssl/private/baikal.public.pem
	SSLCertificateKeyFile /etc/ssl/private/baikal.private.pem
	SSLProtocol -all +TLSv1.2 +TLSv1.3
	SSLHonorCipherOrder On
	SSLCompression off
	SSLSessionTickets off
	SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384

</VirtualHost>
